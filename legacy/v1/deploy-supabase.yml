name: Archived v1 deployment - never run from v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations and Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: lgsdoutarthfymbjgdrj
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # reviewed v1
        with:
          # Pin the CLI so setup does not query GitHub's latest-release API,
          # which can fail when the shared Actions IP reaches its rate limit.
          version: 2.121.0

      - name: Explain missing deployment credential
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo 'Deployment skipped: configure the SUPABASE_ACCESS_TOKEN repository secret.'

      - name: Apply pending migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/*; do
            [[ "$(basename "$function_dir")" == _* ]] && continue
            supabase functions deploy "$(basename "$function_dir")" --project-ref "$SUPABASE_PROJECT_REF"
          done
